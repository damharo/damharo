<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <title>담하로</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          bg:'#faf6ef', card:'#FFFFFF', point:'#87ceeb', accent:'#4a9aba',
          accent2:'#d4a96a', txt:'#2c3e2d', sub:'#7a8a7b', thead:'#e8f4f8'
        },
        fontFamily: { sans:['Gowun Dodum','Noto Sans KR','sans-serif'] }
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior:smooth; }
    ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:#faf6ef; } ::-webkit-scrollbar-thumb { background:#87ceeb; border-radius:3px; }

    .nav-tab { position:relative; padding:12px 24px; font-size:.875rem; font-weight:500; color:#7a8a7b; transition:color .25s; text-decoration:none; }
    .nav-tab::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:0; height:2px; background:#4a9aba; border-radius:1px; transition:width .3s; }
    .nav-tab:hover { color:#4a9aba; } .nav-tab:hover::after { width:60%; }
    .nav-tab.active { color:#4a9aba; } .nav-tab.active::after { width:100%; }

    /* 고정 시간 배너 */
    .fb-item { display:flex; align-items:center; gap:8px; padding:8px 18px; background:white; border:1px solid rgba(135,206,235,.3); border-radius:12px; }
    .fb-day { font-size:.75rem; font-weight:600; color:#7a8a7b; }
    .fb-time { font-size:.9375rem; font-weight:700; color:#2c3e2d; }
    .fb-badge { font-size:.6875rem; font-weight:600; padding:2px 9px; border-radius:20px; }
    .badge-live { background:#e8f4f8; color:#4a9aba; }
    .badge-off  { background:#fdf6e8; color:#d4a96a; }

    /* 달력 */
    .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
    .cal-header { text-align:center; font-size:.8125rem; font-weight:600; color:#7a8a7b; padding:8px 0; }
    .cal-header:first-child { color:#4a9aba; } .cal-header:last-child { color:#87ceeb; }
    .cal-cell { min-height:88px; background:white; border-radius:12px; border:.5px solid rgba(135,206,235,.2); padding:6px 8px; transition:all .2s; cursor:default; }
    .cal-cell:hover { border-color:#87ceeb; box-shadow:0 2px 12px rgba(74,154,186,.1); }
    .cal-cell.empty { background:transparent; border-color:transparent; } .cal-cell.empty:hover { box-shadow:none; }
    .cal-cell.today { border-color:#4a9aba; box-shadow:0 0 0 1px #4a9aba; }
    .cal-cell.past { opacity:.45; }
    .cal-day-num { font-size:.8125rem; font-weight:600; color:#2c3e2d; margin-bottom:4px; }
    .cal-cell.sun .cal-day-num { color:#4a9aba; }
    .cal-cell.sat .cal-day-num { color:#87ceeb; }
    .cal-cell.today .cal-day-num { background:#4a9aba; color:white; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .cal-event { font-size:.6875rem; padding:3px 6px; border-radius:6px; margin-bottom:2px; color:#fff; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; transition:opacity .2s; display:block; width:100%; }
    .cal-event:hover { opacity:.82; }
    .cal-event.highlight { animation:pulse-glow 1.5s ease-in-out infinite; }
    @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(74,154,186,.4);} 50%{box-shadow:0 0 12px 4px rgba(74,154,186,.4);} }

    /* 리스트 뷰 */
    .list-date-group { margin-bottom:14px; }
    .list-date-group.past { opacity:.42; }
    .list-date-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; padding:0 4px; }
    .list-day-num { width:40px; height:40px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:white; border:.5px solid rgba(135,206,235,.25); font-weight:700; font-size:1rem; color:#2c3e2d; line-height:1; }
    .list-day-num.today { background:#4a9aba; color:white; border-color:#4a9aba; }
    .list-day-num.sun { color:#4a9aba; } .list-day-num.sat { color:#87ceeb; }
    .list-day-num.today.sun,.list-day-num.today.sat { color:white; }
    .list-day-label { font-size:.75rem; font-weight:500; color:#7a8a7b; }
    .list-event-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:white; border-radius:12px; border:.5px solid rgba(135,206,235,.15); margin-bottom:6px; transition:all .2s; cursor:pointer; }
    .list-event-item:hover { border-color:#87ceeb; box-shadow:0 2px 10px rgba(74,154,186,.1); }
    .list-event-bar { width:3px; height:32px; border-radius:2px; flex-shrink:0; }
    .list-event-title { font-size:.9375rem; font-weight:600; color:#2c3e2d; }
    .list-event-time { font-size:.75rem; color:#7a8a7b; margin-top:1px; }
    .list-event-badge { font-size:.6875rem; padding:3px 10px; border-radius:999px; font-weight:500; flex-shrink:0; }

    .today-divider { display:flex; align-items:center; gap:10px; margin:18px 0 12px; padding:0 4px; }
    .today-divider::before,.today-divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,#4a9aba,transparent); }
    .today-divider span { font-size:.75rem; font-weight:700; color:#4a9aba; white-space:nowrap; letter-spacing:1px; }

    .legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

    /* modal */
    .modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-backdrop.open { display:flex; }
    .modal-content { background:#faf6ef; border-radius:20px; padding:28px; max-width:400px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.15); }

    .desktop-only { display:block; } .mobile-only { display:none; }
    @media(max-width:768px) {
      .desktop-only { display:none; } .mobile-only { display:block; }
      .nav-tab { padding:10px 16px; font-size:.8125rem; }
    }
  </style>
</head>
<body class="bg-bg min-h-screen font-sans">

  <nav class="sticky top-0 z-50 bg-bg/95 backdrop-blur-sm border-b border-point/20">
    <div class="max-w-4xl mx-auto flex items-center justify-center">
      <a href="../" class="nav-tab">프로필</a>
      <a href="../schedule/" class="nav-tab active">일정</a>
      <a href="../songbook/" class="nav-tab">노래책</a>
      <a href="../upbo/" class="nav-tab">업보</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 pb-16">

    <!-- 고정 방송 시간 -->
    <section class="pt-8 pb-4">
      <div class="flex gap-3 justify-center flex-wrap mb-6">
        <div class="fb-item">
          <span class="fb-day">오후</span>
          <span class="fb-time">13:30</span>
          <span class="fb-badge badge-live">LIVE</span>
        </div>
        <div class="fb-item">
          <span class="fb-day">오후</span>
          <span class="fb-time">23:00</span>
          <span class="fb-badge badge-live">LIVE</span>
        </div>
      </div>

      <!-- 월 네비게이션 -->
      <div class="flex items-center justify-between mb-5">
        <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-full bg-white border border-point/20 flex items-center justify-center text-accent hover:bg-thead transition">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2 id="calMonth" class="text-xl md:text-2xl font-bold text-txt"></h2>
        <button onclick="changeMonth(1)" class="w-10 h-10 rounded-full bg-white border border-point/20 flex items-center justify-center text-accent hover:bg-thead transition">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- 범례 -->
      <div class="flex flex-wrap items-center justify-center gap-4 mb-4 desktop-only">
        <div class="flex items-center gap-2"><div class="legend-dot" style="background:#4a9aba"></div><span class="text-xs text-sub">방송</span></div>
        <div class="flex items-center gap-2"><div class="legend-dot" style="background:#f87171"></div><span class="text-xs text-sub">휴방</span></div>
        <div class="flex items-center gap-2"><div class="legend-dot" style="background:#60a5fa"></div><span class="text-xs text-sub">특별방송</span></div>
        <div class="flex items-center gap-2"><div class="legend-dot" style="background:#c084fc"></div><span class="text-xs text-sub">기념일</span></div>
      </div>
    </section>

    <!-- 데스크탑: 달력 -->
    <div class="desktop-only mb-8">
      <div class="cal-grid mb-1">
        <div class="cal-header">일</div><div class="cal-header">월</div><div class="cal-header">화</div>
        <div class="cal-header">수</div><div class="cal-header">목</div><div class="cal-header">금</div><div class="cal-header">토</div>
      </div>
      <div id="calBody" class="cal-grid"></div>
    </div>

    <!-- 데스크탑: Upcoming -->
    <div class="desktop-only mb-8">
      <h3 class="text-sm font-semibold text-sub uppercase tracking-widest mb-3">Upcoming</h3>
      <div id="upcomingList" class="space-y-2"></div>
    </div>

    <!-- 모바일: 리스트 뷰 -->
    <div class="mobile-only">
      <div id="listBody"></div>
    </div>

  </main>

  <!-- 이벤트 모달 -->
  <div id="eventModal" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div id="modalColor" class="w-3 h-3 rounded-full inline-block mr-2" style="vertical-align:middle"></div>
          <span id="modalType" class="text-xs text-sub uppercase tracking-wider"></span>
        </div>
        <button onclick="document.getElementById('eventModal').classList.remove('open')" class="text-sub hover:text-txt">✕</button>
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-txt mb-2"></h3>
      <p id="modalDate" class="text-sm text-sub mb-1"></p>
      <p id="modalTime" class="text-sm text-sub mb-3"></p>
      <p id="modalDesc" class="text-sm text-txt leading-relaxed"></p>
    </div>
  </div>

  <footer class="text-center py-8 text-sub text-xs border-t border-point/10">
    <p>© 2026 담하로 🐿️</p>
    <p class="mt-1" style="color:#b0bac8">Designed &amp; Developed by <strong style="color:#7a8a7b">아키텍트 크리에이티브</strong> · <a href="mailto:profile@soop.info" style="color:#b0bac8;text-decoration:none;">profile@soop.info</a></p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://mvpwyshztjttmdfbuuea.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12cHd5c2h6dGp0dG1kZmJ1dWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxODMyNjgsImV4cCI6MjA5NTc1OTI2OH0.Jdd4nbHouFMbfC10OZfZVSJq_gGPCWIysS1pfeaBP-E';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const DAYS = ['일','월','화','수','목','금','토'];
    const TYPE_COLORS = { normal:'#4a9aba', holiday:'#f87171', special:'#60a5fa', anniversary:'#c084fc' };
    const TYPE_LABELS = { normal:'방송', holiday:'휴방', special:'특별방송', anniversary:'기념일' };

    let currentYear, currentMonth, schedules = [];

    function getColor(s) {
      if (s.status==='anniversary' && s.anniversary_color) return s.anniversary_color;
      return TYPE_COLORS[s.status] || TYPE_COLORS.normal;
    }

    function getEvents(row) {
      const evs = [];
      if (row.status==='holiday') { evs.push({title:'휴방',time:'',color:TYPE_COLORS.holiday,status:'holiday',note:row.note}); return evs; }
      if (row.status==='anniversary') { evs.push({title:row.note||'기념일',time:'',color:getColor(row),status:'anniversary',note:row.note,glow:true}); return evs; }
      if (row.slot1_title) evs.push({title:row.slot1_title,time:row.slot1_time||'',color:getColor(row),status:row.status,note:row.note});
      if (row.slot2_title) evs.push({title:row.slot2_title,time:row.slot2_time||'',color:getColor(row),status:row.status,note:row.note});
      return evs;
    }

    function init() {
      const n = new Date();
      currentYear = n.getFullYear();
      currentMonth = n.getMonth();
      loadMonth();
    }

    async function loadMonth() {
      document.getElementById('calMonth').textContent = `${currentYear}년 ${currentMonth+1}월`;
      const from = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`;
      const last = new Date(currentYear, currentMonth+1, 0).getDate();
      const to   = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
      try {
        const { data } = await sb.from('schedules').select('*').gte('date',from).lte('date',to).order('date');
        schedules = data || [];
      } catch(e) { schedules = []; }
      renderCalendar();
      renderListView();
      renderUpcoming();
    }

    function renderCalendar() {
      const body = document.getElementById('calBody');
      body.innerHTML = '';
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      for (let i=0; i<firstDay; i++) body.innerHTML += '<div class="cal-cell empty"></div>';

      for (let d=1; d<=daysInMonth; d++) {
        const ds = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;
        const isPast  = ds < todayStr && !isToday;
        const dow = new Date(currentYear, currentMonth, d).getDay();
        const row = schedules.find(s => s.date===ds);
        const evs = row ? getEvents(row) : [];

        let cls = 'cal-cell';
        if (dow===0) cls += ' sun';
        if (dow===6) cls += ' sat';
        if (isToday) cls += ' today';
        if (isPast)  cls += ' past';

        const numHtml = `<div class="cal-day-num">${d}</div>`;
        const evHtml = evs.map((ev,i) => {
          const hl = ev.glow ? ' highlight' : '';
          const t = ev.time ? ev.time.slice(0,5)+' ' : '';
          return `<div class="cal-event${hl}" style="background:${ev.color}" onclick="showEvent('${ds}',${i})">${t}${ev.title}</div>`;
        }).join('');

        body.innerHTML += `<div class="${cls}">${numHtml}${evHtml}</div>`;
      }
    }

    function renderListView() {
      const body = document.getElementById('listBody');
      const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const isCurMonth = today.getFullYear()===currentYear && today.getMonth()===currentMonth;
      let html='', todayInserted=false;

      for (let d=1; d<=daysInMonth; d++) {
        const ds = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const row = schedules.find(s => s.date===ds);
        if (!row) continue;
        const evs = getEvents(row);
        if (!evs.length) continue;

        const dow = new Date(currentYear, currentMonth, d).getDay();
        const isToday = isCurMonth && today.getDate()===d;
        const isPast  = ds < todayStr;

        if (isCurMonth && !todayInserted && ds>=todayStr) {
          html += `<div class="today-divider" id="todayAnchor"><span>TODAY</span></div>`;
          todayInserted = true;
        }

        let numCls = 'list-day-num';
        if (isToday) numCls += ' today';
        if (dow===0) numCls += ' sun';
        if (dow===6) numCls += ' sat';

        let evHtml = evs.map((ev,i) => {
          const l = TYPE_LABELS[ev.status]||'방송';
          return `<div class="list-event-item" onclick="showEvent('${ds}',${i})">
            <div class="list-event-bar" style="background:${ev.color}"></div>
            <div class="flex-1 min-w-0">
              <div class="list-event-title">${ev.title}</div>
              ${ev.time ? `<div class="list-event-time">${ev.time.slice(0,5)}</div>` : ''}
            </div>
            <span class="list-event-badge" style="background:${ev.color}20;color:${ev.color}">${l}</span>
          </div>`;
        }).join('');

        html += `<div class="list-date-group${isPast?' past':''}">
          <div class="list-date-header">
            <div class="${numCls}">${d}</div>
            <div class="list-day-label">${DAYS[dow]}요일${isToday?' · 오늘':''}</div>
          </div>
          ${evHtml}
        </div>`;
      }
      if (!html) html='<div class="text-center py-12 text-sub text-sm">이번 달 일정이 없습니다</div>';
      body.innerHTML = html;
      setTimeout(() => {
        const a = document.getElementById('todayAnchor');
        if (a) a.scrollIntoView({behavior:'smooth',block:'start'});
      }, 100);
    }

    function renderUpcoming() {
      const list = document.getElementById('upcomingList');
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const up = schedules.filter(s => s.date>=todayStr).slice(0,5);
      if (!up.length) { list.innerHTML='<p class="text-sm text-sub">예정된 일정이 없습니다</p>'; return; }
      list.innerHTML = up.map(row => {
        const evs = getEvents(row);
        if (!evs.length) return '';
        const ev = evs[0];
        const dd = new Date(row.date+'T00:00:00');
        const ds = `${dd.getMonth()+1}/${dd.getDate()} (${DAYS[dd.getDay()]})`;
        return `<div class="flex items-center gap-4 p-4 bg-white rounded-xl border border-point/10 hover:border-point/30 transition cursor-pointer" onclick="showEvent('${row.date}',0)">
          <div class="w-1 h-10 rounded-full flex-shrink-0" style="background:${ev.color}"></div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-txt text-sm">${ev.title}</div>
            <div class="text-xs text-sub">${ds}${ev.time?' · '+ev.time.slice(0,5):''}</div>
          </div>
          <span class="text-xs px-2 py-1 rounded-full flex-shrink-0" style="background:${ev.color}20;color:${ev.color}">${TYPE_LABELS[ev.status]||'방송'}</span>
        </div>`;
      }).join('');
    }

    function showEvent(ds, idx) {
      const row = schedules.find(s => s.date===ds);
      if (!row) return;
      const evs = getEvents(row);
      const ev = evs[idx];
      if (!ev) return;
      const dd = new Date(ds+'T00:00:00');
      document.getElementById('modalColor').style.background = ev.color;
      document.getElementById('modalType').textContent = TYPE_LABELS[ev.status]||'방송';
      document.getElementById('modalTitle').textContent = ev.title;
      document.getElementById('modalDate').textContent = `${currentYear}년 ${dd.getMonth()+1}월 ${dd.getDate()}일 (${DAYS[dd.getDay()]})`;
      document.getElementById('modalTime').textContent = ev.time ? ev.time.slice(0,5) : '';
      document.getElementById('modalDesc').textContent = ev.note || '';
      document.getElementById('eventModal').classList.add('open');
    }

    function closeModal(e) { if(e.target===e.currentTarget) document.getElementById('eventModal').classList.remove('open'); }

    function changeMonth(o) {
      currentMonth += o;
      if (currentMonth<0) { currentMonth=11; currentYear--; }
      if (currentMonth>11) { currentMonth=0; currentYear++; }
      loadMonth();
    }

    init();
  </script>
</body>
</html>
